name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Oxlint
        run: npm run lint

      - name: Content & Pedagogical Validation
        run: npm run validate:content

      - name: Translation i18n Audit
        run: npm run check:translations

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Bundle Size Budget Check (<= 250 KB gzip)
        run: node scripts/analyze-bundle.js

      - name: Lighthouse CI & PWA Compliance
        run: npm run audit:pwa

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Smoke Tests
        run: npx playwright test
